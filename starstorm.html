<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Storm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f1e;--cyan:#5ff2ff;--red:#ff3b6b;--gold:#ffd34d;--green:#6dff9c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:#fff;font-family:'Black Han Sans','Orbitron',sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;touch-action:none}
body.playing canvas{cursor:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.2vh,22px);text-align:center;z-index:5;padding:16px;overflow:auto}
.screen.hidden{display:none}
#title{background:radial-gradient(ellipse at 50% 45%,rgba(11,15,30,0) 0%,rgba(11,15,30,.55) 70%)}
#pause,#over{background:radial-gradient(ellipse at center,rgba(11,15,30,.72),rgba(5,7,16,.94));backdrop-filter:blur(3px)}
.logo{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(40px,min(10vw,13vh),112px);letter-spacing:.08em;line-height:1;position:relative}
.logo .row{display:block;white-space:nowrap}
.logo .ch{display:inline-block;--d:0s;animation:drop .9s cubic-bezier(.2,1.5,.4,1) var(--d) both,bob 2.8s ease-in-out calc(var(--d) + .9s) infinite;background:linear-gradient(180deg,#fff 0%,var(--cyan) 50%,#2a6bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(95,242,255,.65))}
.logo .row2 .ch{background:linear-gradient(180deg,#fff 0%,var(--red) 50%,#a0003a 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 14px rgba(255,59,107,.7))}
@keyframes drop{0%{transform:translateY(-140px) scale(2.4) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tag{font-family:Orbitron;font-weight:700;font-size:clamp(10px,1.4vw,13px);letter-spacing:.5em;color:var(--gold);opacity:.9;animation:flick 3s infinite}
@keyframes flick{0%,92%,100%{opacity:.9}93%{opacity:.2}95%{opacity:1}97%{opacity:.3}}
.sub{font-size:clamp(16px,2.4vw,24px);color:#dfe8ff;text-shadow:0 0 12px rgba(95,242,255,.6);animation:fadeUp .8s 1.1s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.btn{font-family:'Black Han Sans',sans-serif;font-size:clamp(18px,2.4vw,24px);color:#0b0f1e;background:var(--cyan);border:0;padding:12px 44px;cursor:pointer;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);text-decoration:none;display:inline-block;transition:transform .15s,background .15s,box-shadow .15s;letter-spacing:.06em;position:relative}
.btn:hover,.btn:focus-visible{transform:scale(1.07);background:#fff;outline:none}
.btn.go{animation:fadeUp .6s 1.3s both,pulse 1.6s 2s infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 rgba(95,242,255,0))}50%{filter:drop-shadow(0 0 16px rgba(95,242,255,.9))}}
.btn.ghost{background:transparent;color:var(--cyan);box-shadow:inset 0 0 0 2px var(--cyan);clip-path:none;padding:9px 30px;font-size:clamp(15px,2vw,19px)}
.btn.ghost:hover{background:var(--cyan);color:#0b0f1e}
.btn.red{background:var(--red);color:#fff}
.btn.red:hover{background:#fff;color:var(--red)}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.keys{display:grid;grid-template-columns:repeat(4,auto);gap:8px 10px;animation:fadeUp .8s 1.5s both}
.key{border:1px solid rgba(95,242,255,.35);background:rgba(95,242,255,.06);padding:7px 12px;font-size:clamp(12px,1.5vw,15px);color:#cfe9ff}
.key b{display:block;font-family:Orbitron;font-weight:700;color:var(--gold);font-size:clamp(10px,1.2vw,12px);letter-spacing:.1em;margin-bottom:3px}
@media (max-width:700px){.keys{grid-template-columns:repeat(2,auto)}}
.best{font-family:Orbitron;font-size:clamp(12px,1.6vw,15px);color:#9fb3d9;letter-spacing:.2em;animation:fadeUp .8s 1.7s both}
.best b{color:var(--gold);font-size:1.4em;margin-left:8px;text-shadow:0 0 10px rgba(255,211,77,.6)}
.big{font-family:Orbitron;font-weight:900;font-size:clamp(40px,min(9vw,12vh),96px);letter-spacing:.1em;line-height:1}
.big .ch{display:inline-block;animation:slam .7s cubic-bezier(.3,1.6,.5,1) var(--d) both;color:var(--red);text-shadow:0 0 22px rgba(255,59,107,.9),3px 0 0 rgba(95,242,255,.6),-3px 0 0 rgba(255,211,77,.5)}
#pause .big .ch{color:var(--cyan);text-shadow:0 0 22px rgba(95,242,255,.9)}
@keyframes slam{0%{transform:translateY(-90px) scale(3);opacity:0;filter:blur(8px)}100%{transform:none;opacity:1;filter:none}}
.ko{font-size:clamp(18px,2.6vw,26px);color:#dfe8ff}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 26px;font-family:Orbitron;font-size:clamp(13px,1.7vw,16px);color:#9fb3d9;letter-spacing:.12em;text-align:left;animation:fadeUp .6s .8s both}
.stats span:nth-child(even){color:#fff;text-align:right;font-weight:700}
.score{font-family:Orbitron;font-weight:900;font-size:clamp(30px,5vw,54px);color:var(--gold);text-shadow:0 0 18px rgba(255,211,77,.7);animation:fadeUp .6s .6s both}
.rec{font-family:Orbitron;font-weight:900;color:#0b0f1e;background:var(--gold);padding:4px 14px;letter-spacing:.2em;font-size:clamp(12px,1.6vw,16px);animation:recp .5s infinite alternate}
.rec.hidden{display:none}
@keyframes recp{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.12) rotate(3deg);box-shadow:0 0 24px var(--gold)}}
.hint{font-size:13px;color:#7f8db0}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="screen">
  <div class="tag">VERTICAL BULLET STORM</div>
  <div class="logo" id="logo"></div>
  <div class="sub">쏟아지는 탄막의 폭풍을 뚫고 살아남아라</div>
  <button class="btn go" id="startBtn">게임 시작</button>
  <div class="keys">
    <div class="key"><b>MOUSE / WASD</b>이동 · 자동 사격</div>
    <div class="key"><b>SHIFT</b>정밀 이동</div>
    <div class="key"><b>X / 우클릭</b>스톰 폭탄</div>
    <div class="key"><b>ESC</b>일시정지</div>
  </div>
  <div class="best">BEST<b id="bestT">0</b></div>
  <a class="btn ghost" href="index.html">메인 메뉴</a>
</div>

<div id="pause" class="screen hidden">
  <div class="big" id="pauseBig"></div>
  <div class="ko">일시정지</div>
  <div class="btns">
    <button class="btn" id="resumeBtn">계속하기</button>
    <a class="btn ghost" href="index.html">메인 메뉴</a>
  </div>
  <div class="hint">ESC 키로 계속하기</div>
</div>

<div id="over" class="screen hidden">
  <div class="big" id="overBig"></div>
  <div class="ko">격추당했습니다</div>
  <div class="score" id="ovScore">0</div>
  <div class="rec hidden" id="ovRec">NEW RECORD!</div>
  <div class="stats">
    <span>BEST</span><span id="ovBest">0</span>
    <span>STAGE</span><span id="ovStage">1</span>
    <span>MAX COMBO</span><span id="ovCombo">0</span>
    <span>GRAZE</span><span id="ovGraze">0</span>
  </div>
  <div class="btns">
    <button class="btn red" id="retryBtn">다시하기</button>
    <a class="btn ghost" href="index.html">메인 메뉴</a>
  </div>
</div>

<script>
'use strict';
/* ================= basics ================= */
const C={bg:'#0b0f1e',cyan:'#5ff2ff',red:'#ff3b6b',gold:'#ffd34d',green:'#6dff9c',pink:'#ff6bd8',violet:'#a98bff',white:'#ffffff',orange:'#ff9a3b',blue:'#4d8bff'};
const TAU=Math.PI*2;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[(Math.random()*a.length)|0];
function hexA(h,a){const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
const easeOutBack=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FW=480,FH=720;
let DPR=1,VW=0,VH=0,SC=1,OX=0,OY=0;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  SC=Math.min(VW/FW,VH/FH);OX=(VW-FW*SC)/2;OY=(VH-FH*SC)/2;
}
addEventListener('resize',resize);resize();

/* ================= storage ================= */
const BEST_KEY='flightgames.best.starstorm';
function loadBest(){try{const v=parseInt(localStorage.getItem(BEST_KEY),10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveBest(s){try{if(s>loadBest()){localStorage.setItem(BEST_KEY,String(s));return true;}}catch(e){}return false;}
let best=loadBest();

/* ================= sprites ================= */
const spr={};
function bulletSprite(col,r,rice){
  const k=col+r+(rice?'r':'o');if(spr[k])return spr[k];
  const s=Math.ceil(r*2.6),c=document.createElement('canvas');c.width=c.height=s*2;
  const g=c.getContext('2d');g.translate(s,s);if(rice)g.scale(1,.48);
  const gr=g.createRadialGradient(0,0,0,0,0,s);
  gr.addColorStop(0,'#fff');gr.addColorStop(r*.5/s,'#fff');gr.addColorStop(r*.8/s,col);
  gr.addColorStop(r/s,col);gr.addColorStop(r*1.2/s,hexA(col,.45));gr.addColorStop(1,hexA(col,0));
  g.fillStyle=gr;g.beginPath();g.arc(0,0,s,0,TAU);g.fill();
  return spr[k]={c,s};
}
function glowSprite(col){
  const k='g'+col;if(spr[k])return spr[k];
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,hexA(col,1));gr.addColorStop(.25,hexA(col,.55));gr.addColorStop(1,hexA(col,0));
  g.fillStyle=gr;g.fillRect(0,0,64,64);return spr[k]=c;
}
function glow(x,y,size,col,a){if(a<=0)return;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(glowSprite(col),x-size/2,y-size/2,size,size);ctx.globalAlpha=1;}

/* nebula tiles (vertically seamless) */
const nebula=[];
(function(){
  const cols=['#4b2a9e','#1f6f9e','#9e2a6a','#2a3f9e','#127a6a'];
  for(let L=0;L<2;L++){
    const w=512,h=1024,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
    for(let i=0;i<(L?7:10);i++){
      const x=rnd(w),y=rnd(h),r=rnd(120,300),col=pick(cols),a=rnd(.12,.3);
      for(const oy of [-h,0,h])for(const ox of [-w,0,w]){
        const gr=g.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,r);gr.addColorStop(0,hexA(col,a));gr.addColorStop(1,hexA(col,0));
        g.fillStyle=gr;g.fillRect(x+ox-r,y+oy-r,r*2,r*2);
      }
    }
    nebula.push(c);
  }
})();
const stars=[];for(let i=0;i<240;i++)stars.push({x:Math.random(),y:Math.random(),z:rnd(.15,1),tw:rnd(TAU),c:Math.random()<.15?C.cyan:Math.random()<.1?C.gold:'#fff'});

/* ================= audio ================= */
let AC=null,MG=null,NB=null;const lastS={};
function audio(){
  if(!AC){try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain();MG.gain.value=.32;const comp=AC.createDynamicsCompressor();MG.connect(comp);comp.connect(AC.destination);
    const len=AC.sampleRate*2;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}}
  else if(AC.state==='suspended'){try{AC.resume();}catch(e){}}
}
function thr(k,ms){const n=performance.now();if(lastS[k]&&n-lastS[k]<ms)return false;lastS[k]=n;return true;}
function tone(type,f0,f1,dur,vol,delay){
  if(!AC)return;try{const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.02);}catch(e){}
}
function nz(dur,vol,f0,f1,delay,type){
  if(!AC)return;try{const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=NB;
  const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}catch(e){}
}
const SFX={
  shoot(){if(thr('s',95))tone('square',1300,620,.04,.022);},
  hit(){if(thr('h',50))tone('square',420,170,.04,.035);},
  eshot(){if(thr('e',80))tone('triangle',760,320,.06,.028);},
  boom(s){s=s||1;if(thr('b',45)){nz(.3*s,.32,2600,120);tone('sine',150,40,.28*s,.3);}},
  big(){nz(1.4,.6,3200,50);tone('sine',90,22,1.2,.6);tone('sawtooth',220,30,.7,.14);},
  graze(){if(thr('g',35))tone('sine',2300,3400,.035,.045);},
  item(){if(thr('i',45))tone('sine',1320,1980,.06,.05);},
  power(){[523,659,784,1047].forEach((f,i)=>tone('square',f,f,.09,.06,i*.055));},
  bomb(){nz(1.6,.55,180,7000,0,'bandpass');tone('sawtooth',70,700,.9,.18);tone('sine',60,25,1.6,.55);},
  warn(){tone('sawtooth',440,880,.34,.1);tone('sawtooth',880,440,.34,.1,.37);},
  death(){nz(1.1,.6,4200,70);tone('square',620,40,.9,.16);},
  phase(){tone('sawtooth',90,900,.5,.14);nz(.7,.4,500,5000,0,'bandpass');},
  shield(){tone('triangle',300,1300,.3,.14);},
  start(){[392,523,659,784,1047].forEach((f,i)=>tone('square',f,f*1.01,.12,.05,i*.07));},
  extend(){[784,988,1175,1568].forEach((f,i)=>tone('triangle',f,f,.14,.08,i*.08));}
};

/* ================= input ================= */
const keys={};const mouse={x:FW/2,y:FH-100,active:false,lx:0,ly:0};let touchId=null,touchLast=null;
addEventListener('keydown',e=>{
  audio();
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();
  if(k==='Escape'){if(state==='play')pauseGame();else if(state==='pause')resumeGame();return;}
  if((k==='Enter'||k===' ')&&(state==='title'||(state==='over'&&overReady))){startGame();return;}
  if((k==='x'||k==='X'||k==='ㅌ')&&state==='play')bomb();
  keys[e.code]=true;
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')pauseGame();});
function toField(cx,cy){return{x:(cx-OX)/SC,y:(cy-OY)/SC};}
cv.addEventListener('mousemove',e=>{
  if(Math.abs(e.clientX-mouse.lx)+Math.abs(e.clientY-mouse.ly)>2)mouse.active=true;
  mouse.lx=e.clientX;mouse.ly=e.clientY;const p=toField(e.clientX,e.clientY);mouse.x=p.x;mouse.y=p.y;
});
cv.addEventListener('mousedown',e=>{audio();if(e.button===2&&state==='play')bomb();});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('touchstart',e=>{audio();const t=e.changedTouches[0];touchId=t.identifier;touchLast={x:t.clientX,y:t.clientY};mouse.active=false;if(e.touches.length>=2&&state==='play')bomb();e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===touchId&&touchLast&&state==='play'&&!P.dead){P.x=clamp(P.x+(t.clientX-touchLast.x)/SC*1.2,10,FW-10);P.y=clamp(P.y+(t.clientY-touchLast.y)/SC*1.2,20,FH-16);touchLast={x:t.clientX,y:t.clientY};}e.preventDefault();},{passive:false});
cv.addEventListener('touchend',e=>{touchId=null;touchLast=null;});

/* ================= state ================= */
let state='title',T=0,overReady=false;
let G=null,P=null,enemies=[],bullets=[],pshots=[],items=[],parts=[],rings=[],pops=[];
const BOSS_NAMES=['HELIOS CORE','NEBULA CROWN','VOID HAMMER','QUASAR WARDEN','ECLIPSE MAW'];
function diff(){return 1+(G.stage-1)*.3;}
function newGame(){
  G={score:0,shown:0,stage:1,lives:3,bombs:3,homing:0,shield:0,graze:0,combo:0,comboT:0,comboPop:0,maxCombo:0,t:0,
     phase:'waves',waveIdx:0,nextWave:2.6,waveEndT:0,warnT:0,boss:null,banner:null,bombT:0,bombX:0,bombY:0,
     flash:0,hurt:0,shake:0,overT:0,slow:0,clearT:0,grazeGlow:0,nextExtend:150000,god:false,scroll:70};
  P={x:FW/2,y:FH+40,ty:FH-110,power:1,focus:false,fireT:0,homT:0,bank:0,inv:2.5,dead:false,respawn:0,enter:.8};
  enemies=[];bullets=[];pshots=[];items=[];parts=[];rings=[];pops=[];
  banner('STAGE 1','폭풍 속으로 출격!',C.cyan);
}
function banner(text,sub,col,dur){G.banner={text,sub,col,t:0,dur:dur||2.6};}
function pop(x,y,txt,col,size,dur){pops.push({x,y,txt,col:col||C.gold,size:size||14,t:0,dur:dur||.9});}

/* ================= fx ================= */
function explode(x,y,s,col){
  s=s||1;col=col||C.orange;const n=Math.min(70,Math.round(14*s));
  for(let i=0;i<n;i++){const a=rnd(TAU),v=rnd(70,380)*Math.sqrt(s);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.3,.85),max:0,t:'spark',col:Math.random()<.35?'#fff':Math.random()<.5?col:C.gold,sz:rnd(1.5,3)});}
  for(let i=0;i<Math.round(4*s);i++){const a=rnd(TAU),v=rnd(40,160)*Math.sqrt(s);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.5,1.1),t:'debris',col,sz:rnd(2,5),rot:rnd(TAU),vr:rnd(-12,12)});}
  for(let i=0;i<Math.round(3*s);i++)parts.push({x:x+rnd(-8,8)*s,y:y+rnd(-8,8)*s,vx:rnd(-20,20),vy:rnd(-20,20),life:rnd(.6,1.1),t:'smoke',sz:rnd(10,20)*Math.sqrt(s)});
  parts.push({x,y,vx:0,vy:0,life:.35,t:'glow',col,sz:70*s});
  parts.push({x,y,vx:0,vy:0,life:.15,t:'glow',col:'#ffffff',sz:40*s});
  rings.push({x,y,r:4,vr:300*Math.sqrt(s),life:.5,max:.5,col,w:5*s});
  rings.push({x,y,r:2,vr:520*Math.sqrt(s),life:.3,max:.3,col:'#ffffff',w:2*s});
  for(const p of parts)if(!p.max)p.max=p.life;
  G.shake=Math.min(28,G.shake+2.5*s);
}
function sparks(x,y,n,col,sp,dir){
  for(let i=0;i<n;i++){const a=dir===undefined?rnd(TAU):dir+rnd(-.7,.7),v=rnd(.3,1)*(sp||200);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.15,.4),max:0,t:'spark',col,sz:rnd(1,2.2)});}
  for(let i=parts.length-n;i<parts.length;i++)if(i>=0&&!parts[i].max)parts[i].max=parts[i].life;
}
function cancelBullets(toStars,cx,cy,radius){
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];
    if(radius){const dx=b.x-cx,dy=b.y-cy;if(dx*dx+dy*dy>radius*radius)continue;}
    if(toStars&&items.length<420)items.push({x:b.x,y:b.y,vx:rnd(-30,30),vy:rnd(-80,-20),type:'star',t:0});
    if(Math.random()<.4)parts.push({x:b.x,y:b.y,vx:0,vy:0,life:.25,max:.25,t:'glow',col:b.col,sz:22});
    bullets[i]=bullets[bullets.length-1];bullets.pop();
  }
}
function addScore(n){
  G.score+=n;
  if(G.score>=G.nextExtend){G.nextExtend=Math.round(G.nextExtend*2.4);G.lives=Math.min(8,G.lives+1);SFX.extend();pop(P.x,P.y-30,'1UP!',C.green,20,1.4);}
}

/* ================= bullets ================= */
function shot(x,y,a,sp,col,kind,r,opt){
  if(bullets.length>1500)return null;
  const b={x,y,a,sp,col,kind,r,acc:0,av:0,max:620,min:20,t:0,grazed:false};
  if(opt)Object.assign(b,opt);bullets.push(b);return b;
}
function fan(x,y,a,n,step,sp,col,kind,r,opt){for(let i=0;i<n;i++)shot(x,y,a+(i-(n-1)/2)*step,sp,col,kind,r,opt);}
function ringShot(x,y,n,a0,sp,col,kind,r,opt){for(let i=0;i<n;i++)shot(x,y,a0+i*TAU/n,sp,col,kind,r,opt);}
function aimAt(x,y){return Math.atan2(P.y-y,P.x-x);}
function muzzle(x,y,col){parts.push({x,y,vx:0,vy:0,life:.14,max:.14,t:'glow',col,sz:30});}

/* ================= enemies ================= */
function bez(p,t){const u=1-t;return{x:u*u*u*p[0].x+3*u*u*t*p[1].x+3*u*t*t*p[2].x+t*t*t*p[3].x,y:u*u*u*p[0].y+3*u*u*t*p[1].y+3*u*t*t*p[2].y+t*t*t*p[3].y};}
const V=(x,y)=>({x,y});
const EDEF={drone:{hp:3,r:13,score:100},fighter:{hp:13,r:18,score:350},heavy:{hp:80,r:30,score:2000}};
function mkEnemy(kind,segs,delay,fire){

  const e={kind,segs,si:0,st:0,delay:delay||0,hp:b.hp*d,maxHp:b.hp*d,r:b.r,score:b.score,x:segs[0].p?segs[0].p[0].x:-99,y:segs[0].p?segs[0].p[0].y:-99,
    ang:Math.PI/2,flash:0,fire,fireT:rnd(.5,1.4),spinA:rnd(TAU),t:0,dead:false,burst:0};
  enemies.push(e);return e;
}
function spawnWave(){

  if(k==='swoop'){
    const s=Math.random()<.5?1:-1,n=5+Math.min(4,st),y0=rnd(50,140),fk=Math.random()<.35?'fighter':'drone';

  }else if(k==='vee'){

  }else if(k==='snake'){

      mkEnemy('drone',[{p:[V(FW+30,40),V(FW*.6,180),V(FW*.4,320),V(-40,FH*.7)],d:4.2}],i*.3+.15,i%2?null:'aim1');

      mkEnemy('heavy',[{p:[V(x,-60),V(x,y-80),V(x,y-20),V(x,y)],d:2},{hold:7+st*.5},{p:[V(x,y),V(x,y+60),V(x,FH*.7),V(x,FH+70)],d:4}],j*.6,'spiral');}
    for(let i=0;i<2;i++){const s=i?1:-1;
      mkEnemy('fighter',[{p:[V(FW/2+s*260,-40),V(FW/2+s*160,200),V(FW/2+s*120,260),V(FW/2+s*180,FH+40)],d:6}],1,'aim3');}
  }
}
function eFire(e){
  const d=diff(),a=aimAt(e.x,e.y),sp=1+(G.stage-1)*.08;
  switch(e.fire){
    case 'aim1':shot(e.x,e.y,a,(150+20*d)*sp,C.red,'orb',5);e.fireT=rnd(1.6,2.8)/d;break;
    case 'aim3':fan(e.x,e.y,a,3,.24,(170+20*d)*sp,C.gold,'rice',5);e.fireT=rnd(1.3,2)/d;break;

function spawnBoss(){

function updateBoss(dt){
  const b=G.boss;b.t+=dt;b.rot+=dt*(.6+b.phase*.6);b.flash=Math.max(0,b.flash-dt);b.lag=lerp(b.lag,b.hp,Math.min(1,dt*3));
  if(b.dying>0){

    if(b.dieT<=0){b.dieT=.09;explode(b.x+rnd(-90,90),b.y+rnd(-50,50),rnd(1,2),pick([C.red,C.gold,C.pink,C.violet]));SFX.boom(1.5);}
    if(b.dying<=0){
      explode(b.x,b.y,6,C.gold);explode(b.x,b.y,4,C.red);SFX.big();G.flash=1;G.shake=30;
      for(let i=0;i<5;i++)rings.push({x:b.x,y:b.y,r:10,vr:200+i*140,life:1.2,max:1.2,col:i%2?C.cyan:C.gold,w:8});

      for(let i=0;i<60;i++)items.push({x:b.x+rnd(-80,80),y:b.y+rnd(-40,40),vx:rnd(-160,160),vy:rnd(-240,-60),type:'star',t:0});

  }
  // movement

  else if(b.phase===0){b.x=lerp(b.x,FW/2+Math.sin(b.t*.55)*120,dt*2);b.y=lerp(b.y,b.ty,dt);}
  else if(b.phase===1){if(Math.abs(b.x-b.tx)<6||b.t3<=0){b.tx=rnd(110,FW-110);b.t3=2.5;}b.t3-=dt;b.x=lerp(b.x,b.tx,dt*1.4);b.y=lerp(b.y,b.ty+Math.sin(b.t)*20,dt*2);}
  else{b.x=lerp(b.x,FW/2+Math.sin(b.t*1.1)*150,dt*2.4);b.y=lerp(b.y,b.ty+Math.sin(b.t*2.2)*30,dt*2);}
  if(b.phase>0&&Math.random()<dt*(b.phase*6))parts.push({x:b.x+rnd(-80,80),y:b.y+rnd(-20,30),vx:rnd(-10,10),vy:rnd(-60,-20),life:1,max:1,t:'smoke',sz:rnd(10,18)});
  const ph=b.hp>b.maxHp*2/3?0:b.hp>b.maxHp/3?1:2;
  if(ph!==b.phase){
    b.phase=ph;b.inv=1.8;b.t1=.6;b.t2=1.2;cancelBullets(true);
    explode(b.x,b.y,3.5,ph===1?C.pink:C.red);SFX.phase();G.flash=.6;G.shake=20;
    for(let i=0;i<3;i++)rings.push({x:b.x,y:b.y,r:20,vr:300+i*160,life:.9,max:.9,col:i?C.red:'#fff',w:6});
    banner('PHASE '+(ph+1),ph===2?'최종 형태 · 코어 폭주':'장갑 파괴 · 패턴 변화',ph===2?C.red:C.pink,1.8);
    drop(b.x,b.y,'P');
  }
  if(b.inv>0){b.inv-=dt;return;}
  if(P.dead)return;
  const d=diff(),sp=1+(G.stage-1)*.1;
  b.t1-=dt;b.t2-=dt;
  if(b.phase===0){
    if(b.t1<=0){b.t1=.12/Math.sqrt(d);
      for(let k=0;k<2;k++)shot(b.x,b.y+20,b.a+k*Math.PI,140*sp,C.violet,'rice',5);
      b.a+=.21;}
    if(b.t2<=0){b.t2=1.5/d;
      for(const s of [-1,1]){const tx=b.x+s*72,ty=b.y+14;fan(tx,ty,aimAt(tx,ty),5,.16,210*sp,C.gold,'rice',5);muzzle(tx,ty,C.gold);}

  }else if(b.phase===1){
    if(b.t1<=0){b.t1=1.15/d;const n=Math.min(40,20+G.stage*4),a0=rnd(TAU);
      for(let i=0;i<n;i++)shot(b.x,b.y,a0+i*TAU/n,90*sp,i%2?C.pink:C.violet,'orb',6,{av:i%2?.55:-.55,acc:55,max:240*sp});
      muzzle(b.x,b.y,C.pink);SFX.eshot();}
    if(b.t2<=0){b.t2=.9/Math.sqrt(d);const a=aimAt(b.x,b.y+30);
      for(let i=0;i<4;i++)shot(b.x,b.y+30,a,(190+i*28)*sp,C.red,'orb',6);
      for(const s of [-1,1])shot(b.x+s*72,b.y+14,a+s*.25,180*sp,C.gold,'rice',5);}
  }else{
    if(b.t1<=0){b.t1=.095/Math.sqrt(d);b.t3++;
      for(let k=0;k<3;k++)shot(b.x,b.y+10,b.a+k*TAU/3,150*sp,C.red,'rice',5);
      if(b.t3%2===0)for(let k=0;k<2;k++)shot(b.x,b.y+10,-b.a*1.3+k*Math.PI,115*sp,C.gold,'orb',5);
      b.a+=.17;}
    if(b.t2<=0){b.t2=2/d;ringShot(b.x,b.y,Math.min(36,24+G.stage*3),rnd(TAU),50*sp,C.cyan,'orb',6,{acc:70,max:230*sp});muzzle(b.x,b.y,C.cyan);SFX.eshot();}
  }
}
function hitBoss(b,dmg,x,y){
  if(b.inv>0||b.t<3.2||b.dying>0){if(Math.random()<.3)sparks(x,y,2,'#fff',150,-Math.PI/2);return;}
  b.hp-=dmg;b.flash=.05;if(Math.random()<.35)sparks(x,y,2,C.cyan,200,-Math.PI/2);SFX.hit();

}

/* ================= player ================= */
function bomb(){
  if(!G||P.dead||G.bombs<=0||G.bombT>0)return;
  G.bombs--;G.bombT=2.3;G.bombX=P.x;G.bombY=P.y;P.inv=Math.max(P.inv,2.8);G.flash=1;G.shake=22;

}
function playerHit(){

    G.shield--;P.inv=1.6;cancelBullets(true,P.x,P.y,140);SFX.shield();

    pop(P.x,P.y-30,'SHIELD BREAK',C.green,14);G.shake+=8;return true;
  }

}
function die(){
  P.dead=true;P.respawn=1.8;explode(P.x,P.y,4,C.cyan);SFX.death();G.flash=.8;G.hurt=1;G.shake=26;
  G.lives--;G.combo=0;G.homing=0;cancelBullets(false);
  if(P.power>1){P.power--;drop(P.x,P.y,'P');}

}
function updatePlayer(dt){
  if(P.dead){
    if(G.lives>0){P.respawn-=dt;if(P.respawn<=0){P.dead=false;P.x=FW/2;P.y=FH+40;P.enter=.8;P.inv=3.2;G.bombs=Math.max(G.bombs,3);}}
    return;
  }
  P.inv=Math.max(0,P.inv-dt);
  if(P.enter>0){P.enter-=dt;P.y=lerp(P.y,FH-110,Math.min(1,dt*5));return;}
  P.focus=!!(keys.ShiftLeft||keys.ShiftRight);
  const sp=P.focus?165:390;let dx=0,dy=0;
  if(keys.ArrowLeft||keys.KeyA)dx-=1;if(keys.ArrowRight||keys.KeyD)dx+=1;if(keys.ArrowUp||keys.KeyW)dy-=1;if(keys.ArrowDown||keys.KeyS)dy+=1;
  const ox=P.x;
  if(dx||dy){mouse.active=false;const l=Math.hypot(dx,dy);P.x+=dx/l*sp*dt;P.y+=dy/l*sp*dt;}
  else if(mouse.active){const tx=mouse.x-P.x,ty=mouse.y-P.y,d=Math.hypot(tx,ty),m=(P.focus?260:950)*dt;if(d>.5){const s=Math.min(d,m)/d;P.x+=tx*s;P.y+=ty*s;}}
  P.x=clamp(P.x,10,FW-10);P.y=clamp(P.y,20,FH-16);
  P.bank=lerp(P.bank,clamp((P.x-ox)/dt/400,-1,1),Math.min(1,dt*10));
  // fire
  P.fireT-=dt;
  if(P.fireT<=0){
    P.fireT=.075;const pw=P.power,f=P.focus?.3:1;
    const lines=[[-6,0],[6,0]];
    if(pw>=2)lines.push([-11,-.12*f],[11,.12*f]);
    if(pw>=3)lines.push([-16,0],[16,0]);
    if(pw>=4)lines.push([-13,-.26*f],[13,.26*f]);
    if(pw>=5)lines.push([-20,-.4*f],[20,.4*f],[0,0]);
    for(const [o,a] of lines)pshots.push({x:P.x+o*(P.focus?.6:1),y:P.y-14,vx:Math.sin(a)*950,vy:-Math.cos(a)*950,dmg:1,hom:false});
    SFX.shoot();
  }
  if(G.homing>0){
    G.homing-=dt;P.homT-=dt;
    if(P.homT<=0){P.homT=.2;for(const s of [-1,1])pshots.push({x:P.x+s*16,y:P.y,vx:s*260,vy:-180,dmg:2.2,hom:true,a:Math.atan2(-180,s*260),t:0});}
  }
  // engine particles
  if(Math.random()<.8)parts.push({x:P.x+rnd(-4,4),y:P.y+16,vx:rnd(-20,20),vy:rnd(120,220),life:.25,max:.25,t:'spark',col:C.cyan,sz:1.6});
}

/* ================= stage flow ================= */
function updateStage(dt){
  if(G.phase==='waves'){
    const n=9+G.stage;
    if(G.waveIdx<n){G.nextWave-=dt;if(G.nextWave<=0){spawnWave();G.waveIdx++;G.nextWave=rnd(3.2,4.4)/(1+.07*(G.stage-1));}}
    else{G.waveEndT+=dt;if(enemies.length===0||G.waveEndT>9){G.phase='warning';G.warnT=3.8;G.warnS=0;}}
  }else if(G.phase==='warning'){
    G.warnT-=dt;G.warnS-=dt;if(G.warnS<=0){G.warnS=.85;SFX.warn();}
    if(G.warnT<=0)spawnBoss();
  }else if(G.phase==='clear'){
    G.clearT-=dt;
    if(G.clearT<=0){G.stage++;G.phase='waves';G.waveIdx=0;G.nextWave=2.2;G.waveEndT=0;banner('STAGE '+G.stage,'난이도 상승 · 탄막 강화',C.cyan);SFX.start();}
  }
}

/* ================= update ================= */
function update(dt){
  G.t+=dt;
  updatePlayer(dt);updateStage(dt);
  // enemies
  for(const e of enemies){
    if(e.dead)continue;
    if(e.delay>0){e.delay-=dt;continue;}
    e.t+=dt;e.flash-=dt;const ox=e.x,oy=e.y;const sg=e.segs[e.si];
    if(!sg){e.dead=true;e.gone=true;continue;}
    if(sg.p){e.st+=dt/sg.d;const p=bez(sg.p,Math.min(1,e.st));e.x=p.x;e.y=p.y;if(e.st>=1){e.si++;e.st=0;}}
    else{e.st+=dt;e.x+=Math.sin(e.t*2)*.3;if(e.st>=sg.hold){e.si++;e.st=0;}}
    const vx=e.x-ox,vy=e.y-oy,target=(vx*vx+vy*vy>.05)?Math.atan2(vy,vx):Math.PI/2;
    let da=target-e.ang;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;e.ang+=da*Math.min(1,dt*6);
    if(e.fire&&!P.dead&&e.y>10&&e.y<FH*.72&&e.x>5&&e.x<FW-5){e.fireT-=dt;if(e.fireT<=0)eFire(e);}
    if(!P.dead){const dx=e.x-P.x,dy=e.y-P.y,r=e.r*.7+3;if(dx*dx+dy*dy<r*r&&playerHit()&&e.kind!=='heavy')hitEnemy(e,999,e.x,e.y);}
    if(G.bombT>0&&e.y>-10){e.hp-=dt*110;e.flash=.05;if(e.hp<=0)killEnemy(e);}
  }
  enemies=enemies.filter(e=>!e.dead);
  if(G.boss){
    updateBoss(dt);
    const b=G.boss;
    if(b&&G.bombT>0&&!b.dying)hitBoss(b,dt*90,b.x+rnd(-40,40),b.y+rnd(-20,20));
    if(b&&!P.dead&&!b.dying){const dx=b.x-P.x,dy=b.y-P.y;if(dx*dx+dy*dy<50*50)playerHit();}
  }
  // enemy bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.t+=dt;
    if(b.av)b.a+=b.av*dt;if(b.acc)b.sp=clamp(b.sp+b.acc*dt,b.min,b.max);
    b.x+=Math.cos(b.a)*b.sp*dt;b.y+=Math.sin(b.a)*b.sp*dt;
    if((b.x<-30||b.x>FW+30||b.y<-40||b.y>FH+30)&&b.t>.6){bullets[i]=bullets[bullets.length-1];bullets.pop();continue;}
    if(!P.dead&&P.enter<=0){
      const dx=b.x-P.x,dy=b.y-P.y,d2=dx*dx+dy*dy,hr=b.r*.72+2.5;
      if(d2<hr*hr){if(playerHit()){bullets[i]=bullets[bullets.length-1];bullets.pop();continue;}}
      else if(!b.grazed&&d2<(b.r+20)*(b.r+20)&&!P.dead){b.grazed=true;graze(b);}
    }
  }
  if(G.bombT>.5)cancelBullets(true);
  // player shots
  for(let i=pshots.length-1;i>=0;i--){
    const s=pshots[i];
    if(s.hom){
      s.t+=dt;let tg=null,bd=1e9;
      for(const e of enemies){if(e.delay>0||e.y<0)continue;const d=(e.x-s.x)**2+(e.y-s.y)**2;if(d<bd){bd=d;tg=e;}}
      if(G.boss&&!G.boss.dying){const d=(G.boss.x-s.x)**2+(G.boss.y-s.y)**2;if(d<bd){tg=G.boss;}}
      const spd=Math.min(620,280+s.t*900);
      if(tg){const want=Math.atan2(tg.y-s.y,tg.x-s.x);let da=want-s.a;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;s.a+=clamp(da,-8*dt,8*dt);}
      else{let da=-Math.PI/2-s.a;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;s.a+=clamp(da,-4*dt,4*dt);}
      s.vx=Math.cos(s.a)*spd;s.vy=Math.sin(s.a)*spd;
      if(Math.random()<.6)parts.push({x:s.x,y:s.y,vx:rnd(-15,15),vy:rnd(-15,15),life:.3,max:.3,t:'spark',col:C.green,sz:1.5});
    }
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    let hit=false;
    for(const e of enemies){if(e.dead||e.delay>0)continue;const dx=e.x-s.x,dy=e.y-s.y;if(dx*dx+dy*dy<(e.r+4)*(e.r+4)){hitEnemy(e,s.dmg,s.x,s.y);hit=true;break;}}
    if(!hit&&G.boss&&!G.boss.dying){const b=G.boss,dx=b.x-s.x,dy=(b.y-s.y)*1.6;if(dx*dx+dy*dy<70*70&&b.y>0){hitBoss(b,s.dmg,s.x,s.y);hit=true;}}
    if(hit||s.y<-30||s.y>FH+30||s.x<-30||s.x>FW+30){pshots[i]=pshots[pshots.length-1];pshots.pop();}
  }
  // items
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.t+=dt;const dx=P.x-it.x,dy=P.y-it.y,d=Math.hypot(dx,dy)||1;
    if(!P.dead&&(d<140||P.y<FH*.28||G.bombT>0||(it.type==='star'&&it.t>.4)||G.phase==='clear'))it.mag=true;
    if(it.mag&&!P.dead){it.ms=Math.min(1000,(it.ms||150)+dt*1500);const m=Math.min(d,it.ms*dt);it.x+=dx/d*m;it.y+=dy/d*m;}
    else{it.vy=Math.min(110,it.vy+dt*220);it.vx*=.97;it.x+=it.vx*dt;it.y+=it.vy*dt;}
    if(!P.dead&&d<22){collect(it);items[i]=items[items.length-1];items.pop();continue;}
    if(it.y>FH+30){items[i]=items[items.length-1];items.pop();}
  }
  updateFX(dt);
  // timers
  G.comboT-=dt;if(G.comboT<=0)G.combo=0;G.comboPop=Math.max(0,G.comboPop-dt*4);
  if(G.bombT>0)G.bombT-=dt;
  G.grazeGlow=Math.max(0,G.grazeGlow-dt*3);
  if(G.overT>0){G.overT-=dt;if(G.overT<=0)gameOver();}
}
function graze(b){
  G.graze++;addScore(20+10*G.stage);G.grazeGlow=1;SFX.graze();
  const a=Math.atan2(b.y-P.y,b.x-P.x);sparks(lerp(P.x,b.x,.6),lerp(P.y,b.y,.6),4,'#ffffff',260,a);
  if(G.graze%25===0)pop(P.x,P.y-34,'GRAZE ×'+G.graze,C.cyan,15);
}
function collect(it){
  switch(it.type){
    case 'P':if(P.power<5){P.power++;SFX.power();pop(P.x,P.y-30,P.power===5?'MAX POWER!':'POWER UP',C.gold,16);rings.push({x:P.x,y:P.y,r:8,vr:260,life:.4,max:.4,col:C.gold,w:3});}
      else{addScore(3000);pop(P.x,P.y-30,'+3000',C.gold,14);SFX.item();}break;
    case 'H':G.homing=Math.min(30,G.homing+14);SFX.power();pop(P.x,P.y-30,'HOMING!',C.green,16);rings.push({x:P.x,y:P.y,r:8,vr:260,life:.4,max:.4,col:C.green,w:3});break;
    case 'S':G.shield=Math.min(2,G.shield+1);SFX.shield();pop(P.x,P.y-30,'SHIELD',C.cyan,16);break;
    case 'B':G.bombs=Math.min(6,G.bombs+1);SFX.power();pop(P.x,P.y-30,'BOMB +1',C.red,16);break;
    default:addScore(10+5*G.stage);SFX.item();parts.push({x:P.x+rnd(-8,8),y:P.y+rnd(-8,8),vx:0,vy:-40,life:.2,max:.2,t:'glow',col:C.gold,sz:14});
  }
}
function updateFX(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts[i]=parts[parts.length-1];parts.pop();continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t==='spark'||p.t==='debris'){p.vx*=1-dt*2.5;p.vy*=1-dt*2.5;}if(p.rot!==undefined)p.rot+=p.vr*dt;}
  if(parts.length>1800)parts.splice(0,parts.length-1800);
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.life-=dt;r.r+=r.vr*dt;r.vr*=1-dt*2;if(r.life<=0)rings.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dt;if(p.t>p.dur)pops.splice(i,1);}
  if(G){G.flash=Math.max(0,G.flash-dt*2.2);G.hurt=Math.max(0,G.hurt-dt*1.5);G.shake=Math.max(0,G.shake-dt*40);if(G.banner){G.banner.t+=dt;if(G.banner.t>G.banner.dur)G.banner=null;}}
}

let bgScroll=0;
function drawBG(dt,speed){

  for(let L=0;L<2;L++){
    const img=nebula[L],w=Math.max(VW,VH*.6),h=w*2,y=(bgScroll*(L?.35:.18))%h;
    ctx.globalAlpha=L?.8:1;
    for(let yy=y-h;yy<VH;yy+=h)ctx.drawImage(img,(VW-w)/2,yy,w,h);
  }
  ctx.globalAlpha=1;
  const warp=clamp((speed-80)/500,0,1);
  for(const s of stars){
    const y=((s.y*VH+bgScroll*s.z*1.4)%(VH+20))-10,x=s.x*VW;
    const tw=.55+.45*Math.sin(T*3+s.tw),len=1+s.z*speed*.02+warp*40*s.z;
    ctx.fillStyle=s.c;ctx.globalAlpha=s.z*tw;

  }

  ctx.fillStyle='rgba(3,5,12,.55)';ctx.fillRect(0,0,fx,VH);ctx.fillRect(fx+fw,0,VW-fx-fw,VH);

    ctx.globalCompositeOperation='lighter';
    for(const x of [fx,fx+fw]){
      const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,hexA(C.cyan,0));g.addColorStop(.5,hexA(C.cyan,.7));g.addColorStop(1,hexA(C.cyan,0));
      ctx.fillStyle=g;ctx.fillRect(x-1,0,2,VH);

  }
}

function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);

  const col=e.kind==='drone'?C.red:e.kind==='fighter'?C.violet:C.gold;

  ctx.fillStyle=fl?'#fff':'#2a0e22';ctx.strokeStyle=fl?'#fff':col;ctx.lineWidth=2;ctx.lineJoin='round';
  ctx.beginPath();
  if(e.kind==='drone'){ctx.moveTo(0,15);ctx.lineTo(12,-6);ctx.lineTo(5,-2);ctx.lineTo(0,-12);ctx.lineTo(-5,-2);ctx.lineTo(-12,-6);}
  else if(e.kind==='fighter'){ctx.fillStyle=fl?'#fff':'#1d1238';ctx.moveTo(0,20);ctx.lineTo(8,5);ctx.lineTo(23,-2);ctx.lineTo(19,-13);ctx.lineTo(7,-7);ctx.lineTo(0,-15);ctx.lineTo(-7,-7);ctx.lineTo(-19,-13);ctx.lineTo(-23,-2);ctx.lineTo(-8,5);}

  }else if(e.kind==='fighter'){ctx.strokeStyle=hexA(C.violet,.6);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-15,-6);ctx.lineTo(0,6);ctx.lineTo(15,-6);ctx.stroke();}

  for(const p of pops){const k=p.t/p.dur,s=k<.15?easeOutBack(k/.15):1;
    ctx.globalAlpha=k>.7?(1-k)/.3:1;
    ctx.save();ctx.translate(p.x,p.y-k*36);ctx.scale(s,s);
    ctx.font='900 '+p.size+'px Orbitron';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(p.txt,0,0);
    ctx.fillStyle=p.col;ctx.fillText(p.txt,0,0);ctx.restore();}
  ctx.globalAlpha=1;
}
function drawBombFX(){
  const el=2.3-G.bombT,cx=G.bombX,cy=G.bombY,fade=Math.min(1,G.bombT/.7);
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=hexA(C.cyan,.12*fade);ctx.fillRect(0,0,FW,FH);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(el*1.4);
  for(let i=0;i<16;i++){ctx.rotate(TAU/16);const w=30+el*60;ctx.fillStyle=hexA(i%2?C.cyan:C.pink,.16*fade);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(1000,-w);ctx.lineTo(1000,w);ctx.fill();}
  ctx.restore();
  for(let k=0;k<5;k++){const r=el*700-k*120;if(r<=0)continue;ctx.strokeStyle=k%2?C.pink:'#fff';ctx.globalAlpha=fade*Math.max(0,1-r/900);ctx.lineWidth=14-k*2;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke();}
  ctx.globalAlpha=1;
  // hex ripple
  ctx.strokeStyle=hexA(C.cyan,.35*fade);ctx.lineWidth=1.5;const hr=el*500;
  for(let i=0;i<3;i++){const r=hr-i*60;if(r<=0)continue;ctx.beginPath();for(let j=0;j<=6;j++){const a=j*TAU/6+el;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.stroke();}
  glow(cx,cy,300*(1+Math.sin(el*20)*.1),'#ffffff',fade*.8);
  // text
  const ts=el<.25?3-easeOutBack(el/.25)*2:1;const ta=el<1.6?1:Math.max(0,1-(el-1.6)/.6);
  ctx.save();ctx.translate(FW/2,FH*.42);ctx.scale(ts,ts);ctx.transform(1,0,-.2,1,0,0);ctx.globalAlpha=ta;
  ctx.font='900 46px Orbitron';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=C.red;ctx.fillText('STORM',-4,0);ctx.fillStyle=C.cyan;ctx.fillText('STORM',4,0);
  ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fff';ctx.fillText('STORM',0,0);
  ctx.font='900 22px Orbitron';ctx.fillStyle=C.gold;ctx.fillText('B O M B',0,40);
  ctx.restore();ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  if(el<.25){ctx.fillStyle='rgba(255,255,255,'+(1-el*4)+')';ctx.fillRect(0,0,FW,FH);}
}
function stripeBand(y,h,off){
  if(h<=0)return;ctx.save();ctx.beginPath();ctx.rect(0,y,FW,h);ctx.clip();
  ctx.fillStyle='#120c04';ctx.fillRect(0,y,FW,h);ctx.fillStyle=C.gold;
  const o=((off%40)+40)%40;
  for(let x=-80+o;x<FW+80;x+=40){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+20,y);ctx.lineTo(x+20-h,y+h);ctx.lineTo(x-h,y+h);ctx.fill();}
  ctx.restore();
}
function drawWarning(){
  const w=G.warnT,el=3.8-w,pulse=.5+.5*Math.sin(G.t*11);
  const inK=Math.min(1,el*3),outK=Math.min(1,w*3),k=inK*outK;
  ctx.fillStyle=hexA(C.red,(.08+.14*pulse)*k);ctx.fillRect(0,0,FW,FH);
  const vg=ctx.createRadialGradient(FW/2,FH/2,FH*.25,FW/2,FH/2,FH*.75);vg.addColorStop(0,'rgba(255,59,107,0)');vg.addColorStop(1,hexA(C.red,.45*pulse*k));
  ctx.fillStyle=vg;ctx.fillRect(0,0,FW,FH);
  const bh=30*k;
  stripeBand(FH*.37-bh/2,bh,G.t*120);stripeBand(FH*.6-bh/2,bh,-G.t*120);
  ctx.save();ctx.translate(FW/2,FH*.485);const s=1+(1-inK)*1.5;ctx.scale(s,s);ctx.globalAlpha=k*(.65+.35*pulse);
  ctx.font='900 58px Orbitron';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=C.red;ctx.shadowBlur=24;ctx.fillStyle=C.red;ctx.fillText('WARNING',0,0);ctx.shadowBlur=0;
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeText('WARNING',0,0);
  ctx.font='20px "Black Han Sans"';ctx.fillStyle=C.gold;ctx.fillText('초대형 적기 접근 중',0,46);
  ctx.restore();ctx.globalAlpha=1;
  // scanning lines
  ctx.fillStyle=hexA(C.red,.25*k);for(let y=(G.t*200)%8;y<FH;y+=8)ctx.fillRect(0,y,FW,1);
}
function drawBanner(){
  const B=G.banner;if(!B)return;
  const inK=Math.min(1,B.t/.4),outK=Math.min(1,(B.dur-B.t)/.4),e=easeOutBack(inK);
  const y=FH*.4,h=78*outK;
  ctx.fillStyle='rgba(5,8,18,.6)';ctx.fillRect(0,y-h/2,FW,h);
  ctx.fillStyle=B.col;ctx.fillRect(0,y-h/2,FW*inK,2);ctx.fillRect(FW*(1-inK),y+h/2-2,FW*inK,2);
  ctx.save();ctx.beginPath();ctx.rect(0,y-h/2,FW,h);ctx.clip();
  const x=FW/2+(1-e)*-420+(1-outK)*420;
  ctx.font='900 34px Orbitron';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=B.col;ctx.shadowBlur=18;ctx.fillStyle='#fff';ctx.fillText(B.text,x,y-9);ctx.shadowBlur=0;
  ctx.font='16px "Black Han Sans"';ctx.fillStyle=B.col;ctx.fillText(B.sub,FW/2+(1-e)*420-(1-outK)*420,y+22);
  ctx.restore();
}
function drawHUD(){
  const sc=Math.round(G.shown).toString().padStart(9,'0');
  txt('SCORE',14,22,'700 10px Orbitron',C.cyan);
  txt(sc,14,44,'900 22px Orbitron','#fff','left',C.cyan,8);
  const hi=Math.max(best,G.score);
  txt('HI-SCORE',FW-14,22,'700 10px Orbitron',C.gold,'right');
  txt(hi.toString().padStart(9,'0'),FW-14,42,'700 16px Orbitron','#ffe9a8','right');
  txt('STAGE '+G.stage,FW-14,60,'700 11px Orbitron',hexA(C.cyan,.8),'right');
  // lives & bombs
  const by=FH-16;
  for(let i=0;i<Math.max(0,G.lives);i++){ctx.save();ctx.translate(20+i*18,by-26);ctx.scale(.5,.5);ctx.fillStyle=C.cyan;ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(20,12);ctx.lineTo(0,6);ctx.lineTo(-20,12);ctx.closePath();ctx.fill();ctx.restore();}
  for(let i=0;i<G.bombs;i++){const x=20+i*18,y=by-6;ctx.fillStyle=C.red;ctx.beginPath();ctx.arc(x,y,6,0,TAU);ctx.fill();txt('B',x,y+3.5,'900 8px Orbitron','#fff','center');}
  // power
  const px=FW-14-5*16;
  txt('POWER',px,by-26,'700 9px Orbitron',C.gold);
  for(let i=0;i<5;i++){ctx.fillStyle=i<P.power?C.gold:'rgba(255,211,77,.18)';ctx.beginPath();const x=px+i*16;ctx.moveTo(x+3,by-20);ctx.lineTo(x+14,by-20);ctx.lineTo(x+11,by-10);ctx.lineTo(x,by-10);ctx.fill();}
  let iy=by-36;
  if(G.homing>0){txt('HOMING',px,iy-4,'700 9px Orbitron',C.green);ctx.fillStyle=hexA(C.green,.25);ctx.fillRect(px+48,iy-11,30,5);ctx.fillStyle=C.green;ctx.fillRect(px+48,iy-11,30*G.homing/30,5);iy-=14;}
  if(G.shield>0){txt('SHIELD ×'+G.shield,px,iy-4,'700 9px Orbitron',C.cyan);}
  txt('GRAZE '+G.graze,FW/2,FH-10,'700 10px Orbitron',hexA('#ffffff',.55+.45*G.grazeGlow),'center',G.grazeGlow>0?C.cyan:null,12);
  // combo
  if(G.combo>=3){
    const s=1+G.comboPop*.5,col=G.combo>=50?C.pink:G.combo>=20?C.red:C.gold;
    ctx.save();ctx.translate(FW-20,140);ctx.scale(s,s);
    txt(String(G.combo),0,0,'900 30px Orbitron',col,'right',col,14);
    txt('COMBO',0,14,'700 10px Orbitron','#fff','right');
    txt('×'+(1+Math.min(G.combo,100)*.02).toFixed(2),0,28,'700 10px Orbitron',col,'right');
    ctx.restore();
    ctx.fillStyle=hexA(col,.3);ctx.fillRect(FW-80,174,60,3);ctx.fillStyle=col;ctx.fillRect(FW-20-60*Math.max(0,G.comboT/2.4),174,60*Math.max(0,G.comboT/2.4),3);
  }
  // boss bar
  const b=G.boss;
  if(b){
    const x=14,w=FW-28,y=86;
    txt(b.name,x,y-4,'700 10px Orbitron',C.red);
    txt('PHASE '+(b.phase+1)+'/3',x+w,y-4,'700 10px Orbitron','#fff','right');
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x,y,w,8);
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(x,y,w*b.lag/b.maxHp,8);
    const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,C.red);g.addColorStop(.5,C.pink);g.addColorStop(1,C.violet);
    ctx.fillStyle=g;ctx.fillRect(x,y,w*b.hp/b.maxHp,8);
    ctx.fillStyle='#0b0f1e';ctx.fillRect(x+w/3-1,y,2,8);ctx.fillRect(x+w*2/3-1,y,2,8);
    ctx.strokeStyle=hexA(C.red,.7);ctx.lineWidth=1;ctx.strokeRect(x-.5,y-.5,w+1,9);
  }
}
function render(dt){
  const speed=!G||state==='title'?90:G.bombT>0?700:G.phase==='clear'?500:G.phase==='boss'||G.phase==='warning'?150:80;
  G&&(G.scroll=lerp(G.scroll,speed,Math.min(1,dt*2)));
  drawBG(dt,G?G.scroll:speed);
  if(state==='title'||!G){
    fieldTransform();ctx.save();ctx.beginPath();ctx.rect(0,0,FW,FH);ctx.clip();
    drawShip(FW/2+Math.sin(T*1.3)*40,FH*.82+Math.sin(T*2.1)*8,Math.cos(T*1.3)*.5,1);
    if(Math.random()<.9)parts.push({x:FW/2+Math.sin(T*1.3)*40+rnd(-4,4),y:FH*.82+16,vx:rnd(-15,15),vy:rnd(150,250),life:.3,max:.3,t:'spark',col:C.cyan,sz:1.6});
    drawParts();ctx.restore();
    return;
  }
  fieldTransform();
  ctx.save();ctx.beginPath();ctx.rect(0,0,FW,FH);ctx.clip();
  if(G.boss)drawBoss(G.boss);
  for(const it of items)drawItem(it);
  for(const e of enemies)if(e.delay<=0)drawEnemy(e);
  drawShots();
  if(!P.dead){
    const blink=P.inv>0&&Math.floor(T*20)%2===0;
    drawShip(P.x,P.y,P.bank,blink?.35:1);
    if(G.shield>0){ctx.globalCompositeOperation='lighter';ctx.strokeStyle=hexA(C.green,.5+.2*Math.sin(T*8));ctx.lineWidth=2;ctx.beginPath();ctx.arc(P.x,P.y,28,0,TAU);ctx.stroke();glow(P.x,P.y,80,C.green,.2);ctx.globalCompositeOperation='source-over';}
    if(G.grazeGlow>0){ctx.strokeStyle=hexA('#ffffff',G.grazeGlow*.6);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(P.x,P.y,20+(1-G.grazeGlow)*12,0,TAU);ctx.stroke();}
  }
  drawParts();
  drawBullets();
  if(!P.dead&&P.focus){
    ctx.save();ctx.translate(P.x,P.y);ctx.rotate(T*2);ctx.strokeStyle=hexA(C.cyan,.55);ctx.lineWidth=1.5;ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(0,0,24,0,TAU);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    ctx.fillStyle=C.red;ctx.beginPath();ctx.arc(P.x,P.y,5,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(P.x,P.y,3,0,TAU);ctx.fill();
  }
  drawPops();
  if(G.bombT>0)drawBombFX();
  if(G.phase==='warning')drawWarning();
  drawBanner();
  ctx.restore();
  // HUD (no shake)
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);
  drawHUD();
  if(G.hurt>0){const vg=ctx.createRadialGradient(FW/2,FH/2,FH*.2,FW/2,FH/2,FH*.7);vg.addColorStop(0,'rgba(255,59,107,0)');vg.addColorStop(1,hexA(C.red,.6*G.hurt));ctx.fillStyle=vg;ctx.fillRect(0,0,FW,FH);}
  if(G.flash>0){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='rgba(255,255,255,'+Math.min(.85,G.flash)+')';ctx.fillRect(0,0,VW,VH);}
}

/* ================= screens ================= */
const $=id=>document.getElementById(id);
function letters(el,str,cls,base,step){el.innerHTML='';for(const [i,ch] of [...str].entries()){const s=document.createElement('span');s.className='ch';s.textContent=ch===' '?' ':ch;s.style.setProperty('--d',(base+i*step)+'s');el.appendChild(s);}}
(function(){const l=$('logo');const r1=document.createElement('span');r1.className='row row1';const r2=document.createElement('span');r2.className='row row2';l.append(r1,r2);letters(r1,'STAR','',0,.08);letters(r2,'STORM','',.35,.08);})();
$('bestT').textContent=best.toLocaleString();
function show(id){for(const s of ['title','pause','over'])$(s).classList.toggle('hidden',s!==id);}
function startGame(){audio();newGame();state='play';overReady=false;show(null);document.body.classList.add('playing');SFX.start();mouse.active=false;}
function pauseGame(){if(state!=='play')return;state='pause';letters($('pauseBig'),'PAUSE','',0,.05);show('pause');document.body.classList.remove('playing');}
function resumeGame(){if(state!=='pause')return;state='play';show(null);document.body.classList.add('playing');last=performance.now();}
function gameOver(){
  state='over';document.body.classList.remove('playing');
  const rec=saveBest(G.score);best=loadBest()||Math.max(best,G.score);
  letters($('overBig'),'GAME OVER','',0,.07);
  $('ovRec').classList.toggle('hidden',!rec);$('ovBest').textContent=Math.max(best,G.score).toLocaleString();
  $('ovStage').textContent=G.stage;$('ovCombo').textContent=G.maxCombo;$('ovGraze').textContent=G.graze;
  show('over');overReady=false;setTimeout(()=>{overReady=true;},700);
  const target=G.score,t0=performance.now();
  (function cnt(){const k=Math.min(1,(performance.now()-t0)/1400);$('ovScore').textContent=Math.round(target*(1-Math.pow(1-k,3))).toLocaleString();if(k<1&&state==='over')requestAnimationFrame(cnt);})();
}
$('startBtn').onclick=startGame;$('retryBtn').onclick=startGame;$('resumeBtn').onclick=resumeGame;

/* ================= loop ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,Math.max(0,(now-last)/1000));last=now;T+=dt;
  try{
    if(state==='play'){
      const sdt=G.slow>0?dt*.35:dt;if(G.slow>0)G.slow-=dt;
      update(sdt);G.shown+=(G.score-G.shown)*Math.min(1,dt*8);
    }else if(state==='over'||state==='title'){if(G)updateFX(dt);else{for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)parts.splice(i,1);}}}
    render(state==='pause'?0:dt);
  }catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* debug hooks for testing */
window.StarStorm={
  start:startGame,
  boss(){if(state!=='play')startGame();enemies.length=0;bullets.length=0;G.waveIdx=99;G.phase='warning';G.warnT=.01;G.banner=null;},
  warning(){if(state!=='play')startGame();G.waveIdx=99;G.phase='warning';G.warnT=3.8;G.warnS=0;},
  power(n){P.power=clamp(n,1,5);},god(on){G.god=on!==false;},
  get state(){return{state,stage:G&&G.stage,phase:G&&G.phase,score:G&&G.score,bullets:bullets.length,enemies:enemies.length,boss:!!(G&&G.boss)};}
};
